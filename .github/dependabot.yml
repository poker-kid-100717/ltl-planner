version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule: { interval: "weekly" }
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "weekly" }
    groups:
      # Angular packages must move together; one-package bumps fail on peer ranges.
      web:
        patterns: ["*"]
    ignore:
      # Angular 22 requires typescript >=6.0 <6.1; take TypeScript majors with the
      # Angular release that supports them rather than as standalone bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/cloudflare"
    schedule: { interval: "weekly" }
    groups:
      cloudflare:
        patterns: ["*"]
