name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Publication safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/scan-for-sensitive.sh
      - run: bash -n scripts/cloudflare-deploy.sh

  backend:
    name: .NET 10 API and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ltl_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ltl_planner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=ltl_planner;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/Portfolio.Ltl.Api.Tests.csproj
      - name: Vulnerability report
        run: dotnet list api/Portfolio.Ltl.Api.csproj package --vulnerable --include-transitive
      - run: dotnet build api/Portfolio.Ltl.Api.csproj -c Release --no-restore
      - run: dotnet test tests/Portfolio.Ltl.Api.Tests.csproj -c Release --no-restore

  frontend:
    name: Angular 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet

  cloudflare:
    name: Cloudflare deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/cloudflare-deploy.sh
        env:
          VALIDATE_ONLY: "true"
          APP_HOST: ltl.example.com
          DATABASE_URL: postgres://demo:demo@localhost:5432/ltl?sslmode=require
          DEMO_RESET_TOKEN: dry-run-reset-token
          YARD_LTL_SIGNING_KEY: dry-run-signing-key
